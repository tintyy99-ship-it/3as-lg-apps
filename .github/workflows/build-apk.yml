name: Build APKs

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'eleve-app/web/**'
      - 'admin-app/web/**'
      - 'scripts/e2e.mjs'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright + Supabase client
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright @supabase/supabase-js
          npx playwright install --with-deps chromium

      - name: Serve both apps
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          for APP in eleve-app admin-app; do
            printf 'window.SB_CONFIG = {\n  SUPABASE_URL: "https://xvbswwlphdjtviufwcsx.supabase.co",\n  SUPABASE_ANON_KEY: "%s"\n};\n' "$SUPABASE_ANON_KEY" > "$APP/web/supabase-config.js"
          done
          nohup python3 -m http.server 8091 --directory eleve-app/web >/tmp/s1.log 2>&1 &
          nohup python3 -m http.server 8092 --directory admin-app/web >/tmp/s2.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w "eleve %{http_code}\n" http://localhost:8091/
          curl -s -o /dev/null -w "admin %{http_code}\n" http://localhost:8092/

      - name: Run E2E (bloquant)
        env:
          SB_URL: https://xvbswwlphdjtviufwcsx.supabase.co
          SB_ANON: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMIN_PW: ${{ secrets.ADMIN_PW }}
        run: node scripts/e2e.mjs

  build:
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare WebView assets
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash android/prepare_assets.sh

      - name: Decode Keystore (Play Store, optionnel)
        # Si les 4 secrets sont absents, on genere un keystore debug (build testable, PAS pour Play Store).
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
            echo "KEYSTORE_PATH=/tmp/release.keystore" >> $GITHUB_ENV
            echo "keystore Play Store OK"
          else
            keytool -genkeypair -keystore /tmp/debug-ci.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10950 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
            echo "KEYSTORE_PATH=/tmp/debug-ci.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "keystore debug CI genere (test uniquement, PAS pour Play Store)"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build debug APKs + release AAB/APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --project-dir android :eleve:assembleDebug :admin:assembleDebug :eleve:assembleRelease :admin:assembleRelease :eleve:bundleRelease :admin:bundleRelease --stacktrace

      - name: Verify launcher icons (aapt2, bloquant)
        run: |
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | head -1)
          echo "aapt2: $AAPT"
          for APK in android/eleve/build/outputs/apk/debug/eleve-debug.apk android/admin/build/outputs/apk/debug/admin-debug.apk android/eleve/build/outputs/apk/release/eleve-release.apk android/admin/build/outputs/apk/release/admin-release.apk; do
            echo "== $APK"
            SIZE=$(stat -c%s "$APK")
            echo "taille: $SIZE octets"
            # Garde anti-APK vide/casse : un build sain fait ~280 Ko, le v1.6 casse faisait 35 Ko.
            if [ "$SIZE" -lt 100000 ]; then echo "APK SUSPECT TROP PETIT: $APK ($SIZE octets)" && exit 1; fi
            $AAPT dump badging "$APK" | grep -E "^application:|^application-icon|launchable-activity" || (echo "BADGING ECHEC $APK" && exit 1)
          done
          $AAPT dump badging android/eleve/build/outputs/apk/release/eleve-release.apk | grep -q "application-icon" || (echo "ICONE MANQUANTE ELEVE" && exit 1)
          $AAPT dump badging android/admin/build/outputs/apk/release/admin-release.apk | grep -q "application-icon" || (echo "ICONE MANQUANTE ADMIN" && exit 1)
          # Les 2 PNG doivent etre differents entre eleve et admin (pas d'icone dupliquee)
          ELEVE_ICON=$($AAPT dump badging android/eleve/build/outputs/apk/release/eleve-release.apk | grep -o "application-icon[^']*'[^']*'" | head -1)
          ADMIN_ICON=$($AAPT dump badging android/admin/build/outputs/apk/release/admin-release.apk | grep -o "application-icon[^']*'[^']*'" | head -1)
          echo "eleve: $ELEVE_ICON"
          echo "admin: $ADMIN_ICON"
          echo "ICONES OK"

      - name: Rename APKs/AABs (v1.10)
        run: |
          cp android/eleve/build/outputs/apk/debug/eleve-debug.apk 3AS-LG-Eleve-v1.10-debug.apk
          cp android/admin/build/outputs/apk/debug/admin-debug.apk 3AS-LG-Admin-v1.10-debug.apk
          cp android/eleve/build/outputs/apk/release/eleve-release.apk 3AS-LG-Eleve-v1.10.apk
          cp android/admin/build/outputs/apk/release/admin-release.apk 3AS-LG-Admin-v1.10.apk
          cp android/eleve/build/outputs/bundle/release/eleve-release.aab 3AS-LG-Eleve-v1.10.aab
          cp android/admin/build/outputs/bundle/release/admin-release.aab 3AS-LG-Admin-v1.10.aab
          ls -la *.apk *.aab

      - name: Upload APKs/AABs
        uses: actions/upload-artifact@v4
        with:
          name: apks-aab-3as-lg-v1.10
          path: |
            3AS-LG-Eleve-v1.10-debug.apk
            3AS-LG-Admin-v1.10-debug.apk
            3AS-LG-Eleve-v1.10.apk
            3AS-LG-Admin-v1.10.apk
            3AS-LG-Eleve-v1.10.aab
            3AS-LG-Admin-v1.10.aab
