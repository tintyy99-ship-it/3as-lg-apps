name: Build APKs

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'eleve-app/web/**'
      - 'admin-app/web/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare WebView assets
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: bash android/prepare_assets.sh

      - name: Build debug APKs
        run: gradle --project-dir android :eleve:assembleDebug :admin:assembleDebug --stacktrace

      - name: Rename APKs
        run: |
          cp android/eleve/build/outputs/apk/debug/eleve-debug.apk 3AS-LG-Eleve-v1.0.apk
          cp android/admin/build/outputs/apk/debug/admin-debug.apk 3AS-LG-Admin-v1.0.apk
          ls -la *.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks-3as-lg
          path: |
            3AS-LG-Eleve-v1.0.apk
            3AS-LG-Admin-v1.0.apk
