plugins {
    id 'com.android.application'
}

android {
    namespace 'org.lg3as.admin'
    compileSdk 34

    defaultConfig {
        applicationId 'org.lg3as.admin'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.3.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
