plugins {
    id 'com.android.application'
}

android {
    namespace 'org.lg3as.eleve'
    compileSdk 34

    defaultConfig {
        applicationId 'org.lg3as.eleve'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.8'
    }

    signingConfigs {
        release {
            // Play Store: rempli via secrets CI (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
            // Sans secrets: fallback debug pour que assembleRelease/bundleRelease restent testables en CI.
            storeFile file(System.getenv('KEYSTORE_PATH') ?: "${System.getProperty('user.home')}/.android/debug.keystore")
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'android'
            keyAlias System.getenv('KEY_ALIAS') ?: 'androiddebugkey'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
