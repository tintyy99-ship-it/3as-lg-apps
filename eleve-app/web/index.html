<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1e40af">
<title>3AS LG Élève</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="supabase-config.js" onerror="void 0"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto}
body{background:#f1f5f9;color:#0f172a}
header{background:#1e40af;color:#fff;padding:14px;text-align:center;position:sticky;top:0;z-index:10}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #cbd5e1;font-size:16px}
button{background:#1e40af;color:#fff;border:none;font-weight:600;cursor:pointer}
button.ghost{background:#e2e8f0;color:#0f172a}
button.telegram{background:#229ED9}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;border-top:1px solid #e2e8f0}
nav button{background:none;color:#475569;border-radius:0;padding:14px 4px;font-size:13px}
nav button.active{color:#1e40af;font-weight:800}
main{padding-bottom:80px;max-width:700px;margin:auto}
.badge{display:inline-block;background:#dcfce7;color:#166534;padding:2px 10px;border-radius:20px;font-size:12px}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:85%}
.me{background:#dbeafe;margin-left:auto}
.them{background:#f1f5f9}
.matiere{border-left:5px solid #1e40af}
.small{font-size:13px;color:#64748b}
.hidden{display:none}
.row{display:flex;gap:8px}
</style>
</head>
<body>
<header><h2>📚 3AS LG — Espace Élève</h2></header>
<main>
<!-- LOGIN -->
<div id="login" class="card">
<h3>Connexion</h3>
<p class="small">Ton <b>code de référence</b> est fourni par l'administrateur.<br>Pour les cours, explications ou obtenir un code, contacte le support :</p>
<a href="https://t.me/Roqaya_2328" target="_blank"><button class="telegram">💬 Support Telegram : @Roqaya_2328</button></a>
<input id="code" placeholder="Ex : 3AS-X7K9P2" autocapitalize="characters">
<button onclick="login()">Se connecter</button>
<button class="ghost" onclick="openConfig()">⚙️ Config Supabase</button>
<p id="loginErr" class="small" style="color:red"></p>
<div id="cfg" class="hidden">
<input id="url" placeholder="SUPABASE_URL">
<input id="key" placeholder="SUPABASE_ANON_KEY">
<button onclick="saveConfig()">Enregistrer</button>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden">
<div class="card"><span id="hello"></span> <span class="badge" id="exp"></span>
<button class="ghost" onclick="logout()">Déconnexion</button></div>

<div id="tab-cours">
<div class="card"><h3>Matières 3AS LG</h3>
<select id="filtre" onchange="renderCourses()"><option value="">Toutes</option></select>
<div id="courses"></div></div>
</div>

<div id="tab-msg" class="hidden">
<div class="card"><h3>💬 Messagerie Admin</h3>
<div id="msgs" style="max-height:350px;overflow:auto"></div>
<div class="row"><input id="txt" placeholder="Écris à l'admin..."><button style="width:90px" onclick="send()">➤</button></div>
</div>
</div>

<div id="tab-compte" class="hidden">
<div class="card"><h3>Mon compte</h3><div id="profil"></div>
<a href="https://t.me/Roqaya_2328" target="_blank"><button class="telegram">Contacter support Telegram</button></a>
</div>
</div>
</div>
</main>

<nav id="navbar" class="hidden">
<button id="b1" class="active" onclick="tab('cours')">📖 Cours</button>
<button id="b2" onclick="tab('msg')">💬 Messages</button>
<button id="b3" onclick="tab('compte')">👤 Compte</button>
</nav>

<script>
let sb=null, me=null, allCourses=[];
const ADMIN_ID='admin';
const DEFAULT_SB_URL='https://xvbswwlphdjtviufwcsx.supabase.co';
const DEFAULT_SB_KEY=''; // clé ANON à coller 1x via ⚙️ (stockée local, jamais commitée)
function cfg(){const w=(window.SB_CONFIG||{});return {url:w.SUPABASE_URL||localStorage.getItem('SB_URL')||DEFAULT_SB_URL,key:w.SUPABASE_ANON_KEY||localStorage.getItem('SB_KEY')||DEFAULT_SB_KEY}}
function openConfig(){$('cfg').classList.toggle('hidden');$('url').value=cfg().url;$('key').value=cfg().key}
function saveConfig(){localStorage.setItem('SB_URL',$('url').value.trim());localStorage.setItem('SB_KEY',$('key').value.trim());initSB();alert('Config enregistrée')}
function $(id){return document.getElementById(id)}
function initSB(){try{const c=cfg();if(c.url&&c.key&&window.supabase){sb=window.supabase.createClient(c.url,c.key)}}catch(e){sb=null}}
initSB();
const sess=localStorage.getItem('3as_student');if(sess){try{me=JSON.parse(sess);showApp()}catch(e){}}

async function login(){
 if(!sb)return $('loginErr').textContent='Configure Supabase d’abord (⚙️).';
 const code=$('code').value.trim().toUpperCase();
 if(!code)return $('loginErr').textContent='Entre ton code.';
 const {data,error}=await sb.from('students').select('*').eq('code_reference',code).single();
 if(error||!data)return $('loginErr').textContent='Code invalide.';
 if(!data.statut_actif)return $('loginErr').textContent='⛔ Code suspendu par l’admin. Contacte le support Telegram.';
 if(data.date_expiration_code&&new Date(data.date_expiration_code)<new Date())
   return $('loginErr').textContent='Code expiré. Demande une prolongation via Telegram.';
 me=data;localStorage.setItem('3as_student',JSON.stringify(me));showApp();
}
function showApp(){
 $('login').classList.add('hidden');$('app').classList.remove('hidden');$('navbar').classList.remove('hidden');
 $('hello').textContent=`Salut ${me.prenom} ${me.nom} 👋`;
 $('exp').textContent='Expire: '+(me.date_expiration_code||'—').slice(0,10);
 $('profil').innerHTML=`<p><b>${me.prenom} ${me.nom}</b><br>${me.email||''}<br>Code: <b>${me.code_reference}</b><br>Expire: ${me.date_expiration_code||'—'}</p>`;
 loadCourses();try{if(sb){loadMsgs();subscribe()}}catch(e){}
}
function logout(){localStorage.removeItem('3as_student');location.reload()}
function tab(t){['cours','msg','compte'].forEach(x=>{$('tab-'+x).classList.toggle('hidden',x!==t)});['b1','b2','b3'].forEach(b=>$(b).classList.remove('active'));if(t==='cours')$('b1').classList.add('active');if(t==='msg')$('b2').classList.add('active');if(t==='compte')$('b3').classList.add('active')}

async function loadCourses(){
 try{
  if(!sb||!window.supabase) throw 0;
  const {data}=await sb.from('courses').select('*').order('matiere').order('ordre');
  allCourses=data&&data.length?data:FALLBACK;
 }catch(e){ allCourses=FALLBACK; }
 const mats=[...new Set(allCourses.map(c=>c.matiere))];
 $('filtre').innerHTML='<option value="">Toutes</option>'+mats.map(m=>`<option>${m}</option>`).join('');
 renderCourses();
}
function renderCourses(){
 const f=$('filtre').value;
 const list=allCourses.filter(c=>!f||c.matiere===f);
 $('courses').innerHTML=list.map(c=>`<div class="card matiere"><b>${c.matiere}</b> <span class="small">${c.niveau||'3AS LG'}</span><h4>${c.chapitre}</h4><p>${c.contenu_cours||''}</p><p class="small">💡 <i>${c.explications_simplifiees||''}</i></p></div>`).join('')||'<p class="small">Aucun cours.</p>';
}
async function loadMsgs(){
 const {data}=await sb.from('messages').select('*').eq('student_id',me.id).order('timestamp');
 renderMsgs(data||[]);
 for(const m of (data||[]).filter(m=>m.receiver_id===me.id&&!m.lu)){await sb.from('messages').update({lu:true}).eq('id',m.id)}
}
function renderMsgs(list){
 $('msgs').innerHTML=list.map(m=>`<div class="msg ${m.sender_id===me.id?'me':'them'}">${m.contenu}<br><span class="small">${(m.timestamp||'').slice(0,16)}</span></div>`).join('');
 $('msgs').scrollTop=99999;
}
async function send(){
 const t=$('txt').value.trim();if(!t)return;if(!sb)return alert('Hors ligne : reconnecte-toi.');
 $('txt').value='';
 await sb.from('messages').insert({sender_id:me.id,receiver_id:ADMIN_ID,contenu:t,student_id:me.id});
 loadMsgs();
}
function subscribe(){
 sb.channel('e'+me.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`student_id=eq.${me.id}`},()=>loadMsgs()).subscribe();
}
// Contenu offline si Supabase vide (extrait 3AS LG)
const FALLBACK=[{"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "01. Präsens - Verbes réguliers & irréguliers", "contenu_cours": "Conjugaison présent: ich lerne, du lernst, er lernt... Verbes irréguliers: sprechen→spricht, lesen→liest, fahren→fährt, sein/haben. Ex: Ich spreche Deutsch.", "explications_simplifiees": "Retiens: 2e/3e personne changent souvent e→i/ie, a→ä. Apprends sein/haben par cœur, ils servent partout."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "02. Perfekt (Passé composé)", "contenu_cours": "haben/sein + Partizip II. Ex: Ich habe gelernt / Ich bin gegangen. Participe: ge- + radical + -t (faibles) / -en (forts).", "explications_simplifiees": "Choisis l'auxiliaire: mouvement/changement d'état → sein, sinon haben. Astuce BAC: repère habe/hast... + ge-...-t."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "03. Präteritum (Imparfait / passé narratif)", "contenu_cours": "Formes: lernte, sprach, ging, war, hatte. Utilisé dans récits écrits BAC. Ex: Er ging zur Schule.", "explications_simplifiees": "À l'écrit BAC, préfère Präteritum pour raconter. Retiens war/hatte/ging/kam."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "04. Futur & Plusquamperfekt", "contenu_cours": "Futur: werden + Infinitiv (Ich werde lernen). Plusquamperfekt: hatte/war + Partizip II (Nachdem ich gelernt hatte...).", "explications_simplifiees": "werden + infinitif = futur. hatte/war + participe = plus-que-parfait après nachdem."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "05. Modalverben (können, müssen, wollen, sollen, dürfen, mögen)", "contenu_cours": "können (pouvoir), müssen (devoir), wollen (vouloir), sollen (devoir moral), dürfen (avoir le droit), möchten (aimerais). Verbe principal à l'infinitif en fin. Ex: Ich muss lernen.", "explications_simplifiees": "2e verbe toujours à la fin à l'infinitif. möchten = politesse, très utilisé au BAC."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "06. Trennbare & untrennbare Verben", "contenu_cours": "Séparables: anrufen→ruft...an, aufstehen, mitbringen. Inséparables: bekommen, verstehen, erzählen. Ex: Ich rufe dich an.", "explications_simplifiees": "Si préfixe accentué (an-, auf-, mit-) → se sépare. be-, ver-, er- → ne se sépare jamais."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "07. Deklination: Nominativ, Akkusativ, Dativ", "contenu_cours": "der→den→dem, die→die→der, das→das→dem, die(pl)→die→den. Prépositions AKK: für, ohne, gegen. DAT: mit, nach, bei, von, zu.", "explications_simplifiees": "Apprends par groupes de prépositions. Question BAC classique: mit + Dativ."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "08. Passiv (Voix passive)", "contenu_cours": "werden + Partizip II: wird gebaut, wurde gebaut, ist gebaut worden. Ex: Das Haus wird gebaut.", "explications_simplifiees": "Repère wird/wurde/worden = passif. En français 'être + participe'. Sujet BAC fréquent."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "09. Konjunktiv II (souhait, politesse, irréel)", "contenu_cours": "wäre, hätte, würde + Infinitiv. Wenn ich Zeit hätte, würde ich reisen. Ex politesse: Ich hätte gern...", "explications_simplifiees": "3 mots magiques: wäre/ hätte/ würde. Si + imparfait imaginaire = rêve."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "10. Relativsätze", "contenu_cours": "der/die/das/den/dem/dessen/deren. Verbe à la fin. Ex: Der Mann, der dort steht, ist Lehrer.", "explications_simplifiees": "Comme qui/que mais accordé. Verbe toujours dernier mot de la relative."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "11. Kausalsätze (weil, da, denn)", "contenu_cours": "weil + verbe fin: Ich lerne, weil ich Erfolg haben will. denn + ordre normal. Ex BAC: Umwelt schützen, weil...", "explications_simplifiees": "weil envoie le verbe à la fin, denn ne change rien. Ne les mélange pas."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "12. Finalsätze & Konsekutiv (damit, um...zu, sodass)", "contenu_cours": "damit + sujet différent, um...zu + même sujet. Ex: Ich lerne, um zu bestehen. sodass = conséquence.", "explications_simplifiees": "même sujet → um...zu, sujets différents → damit."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "13. Konzessiv & Konditional (obwohl, wenn, falls)", "contenu_cours": "obwohl + verbe fin (bien que). wenn/falls = si. Ex: Obwohl es schwer ist, lerne ich.", "explications_simplifiees": "obwohl = concession BAC (avantages/inconvénients). Verbe à la fin."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "14. Komparativ & Superlativ", "contenu_cours": "klein→kleiner→am kleinsten, gut→besser→am besten. als (différence), wie (égalité). Ex: Deutsch ist leichter als Mathe.", "explications_simplifiees": "Retiens irréguliers: gut/besser, viel/mehr, gern/lieber."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "15. Infinitiv mit zu & Infinitivsätze", "contenu_cours": "Es ist wichtig, Deutsch zu lernen. ohne...zu, anstatt...zu. Ex BAC opinion.", "explications_simplifiees": "zu + infinitif après adjectifs/expressions. Virgule avant."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "16. Wortschatz: Umwelt, Technologie, Gesundheit", "contenu_cours": "die Umwelt, der Klimawandel, nachhaltig, die Energie, das Handy, die Medien, gesund/krank, der Sport. 5 mots/jour avec phrase.", "explications_simplifiees": "Crée tes cartes: mot + article + 1 phrase. Les articles rapportent des points."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "17. Wortschatz: Jugend, Bildung, Gesellschaft", "contenu_cours": "die Jugend, die Ausbildung, der Beruf, die Gesellschaft, die Familie, die Freundschaft. Thèmes BAC 2020-2025.", "explications_simplifiees": "Thèmes BAC récurrents: Jugendprobleme, Studium, Soziale Netzwerke."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "18. Leseverstehen - Méthode BAC", "contenu_cours": "1) Lire questions avant texte 2) Surligner mots-clés 3) Richtig/Falsch + justifier avec citation 4) Titre = idée générale.", "explications_simplifiees": "Ne traduis pas tout: cherche les réponses aux questions d'abord. Gagne 20 min."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "19. Textproduktion: Meinung äußern (expression BAC)", "contenu_cours": "Plan: Einleitung (Thema), Hauptteil (Vorteile/Nachteile + Beispiele), Schluss (eigene Meinung). Connecteurs: zunächst, außerdem, jedoch, meiner Meinung nach, abschließend.", "explications_simplifiees": "Apprends 15 connecteurs + 3 plans types. 120-150 mots, paragraphes."}, {"matiere": "Allemand", "niveau": "3AS LG", "chapitre": "20. BAC Blancs & Sujets types", "contenu_cours": "Sujets: Soziale Netzwerke, Umweltschutz, Jugend und Zukunft. Structure épreuve: Teil 1 Leseverstehen (7pts), Teil 2 Sprachfähigkeit (8pts), Teil 3 Schreiben (5pts).", "explications_simplifiees": "Entraîne-toi en temps réel 2h. Relis les corrigés 2008-2025."}, {"matiere": "Anglais", "niveau": "3AS LG", "chapitre": "01. All Tenses - Révision BAC", "contenu_cours": "Present simple/continuous, Past simple/continuous, Present perfect, Past perfect, Future. Ex: I have lived here since 2020.", "explications_simplifiees": "Timeline: past→perfect, now→simple/continuous, result→perfect. Since + date, for + durée."}, {"matiere": "Anglais", "niveau": "3AS LG", "chapitre": "02. Reported Speech", "contenu_cours": "She said 'I am tired' → She said she was tired. Backshift: present→past, will→would, can→could.", "explications_simplifiees": "Recule d'un temps. Pronoms et lieux changent aussi: here→there."}, {"matiere": "Anglais", "niveau": "3AS LG", "chapitre": "03. Conditionals 0-3 + Wish", "contenu_cours": "Type1: If+present, will. Type2: If+past, would. Type3: If+past perfect, would have +PP. I wish I were...", "explications_simplifiees": "0 vérité, 1 réel, 2 rêve, 3 regret. Wish + past = regret présent."}, {"matiere": "Anglais", "niveau": "3AS LG", "chapitre": "04. Passive Voice", "contenu_cours": "be + PP: is built, was built, has been built. Ex: English is spoken here.", "explications_simplifiees": "Repère be + participe. Agent avec by souvent omis."}, {"matiere": "Anglais", "niveau": "3AS LG", "chapitre": "05. Relative Clauses & Modals", "contenu_cours": "who/which/that/whose. Modals: can, must, should, might. Ex: You should revise.", "explications_simplifiees": "Should = conseil BAC. Whose = dont (possession)."}, {"matiere": "Anglais", "niveau": "3AS LG", "chapitre": "06. Expressing Opinion & Agreement", "contenu_cours": "I believe, In my view, Admittedly... However... BAC essay: introduction, 3 arguments, conclusion.", "explications_simplifiees": "3 connecteurs d'opposition + 3 d'addition minimum par essai."}, {"matiere": "Anglais", "niveau": "3AS LG", "chapitre": "07. Theme: Ethics - Corruption, Fraud", "contenu_cours": "Vocab: bribery, embezzlement, transparency. Textes BAC filière langues: fight against corruption.", "explications_simplifiees": "Apprends 10 mots + 2 exemples Algérie/monde par thème."}, {"matiere": "Anglais", "niveau": "3AS LG", "chapitre": "08. Theme: Education & Civilization", "contenu_cours": "Vocab: literacy, curriculum, ancient civilizations, cultural heritage. Ex: Education builds nations.", "explications_simplifiees": "Thème BAC récurrent: rôle de l'éducation dans le progrès."}, {"matiere": "Anglais", "niveau": "3AS LG", "chapitre": "09. Reading Comprehension Method", "contenu_cours": "Skim (idée), Scan (détails), True/False + justification, Reference words (it, they = ?).", "explications_simplifiees": "Justifie toujours avec la phrase du texte entre guillemets."}, {"matiere": "Anglais", "niveau": "3AS LG", "chapitre": "10. BAC Writing: Expository Essay", "contenu_cours": "Plan 4 paragraphes: intro (thesis), 2-3 body (topic sentence + support), conclusion (restate). 150-200 mots.", "explications_simplifiees": "1 idée = 1 paragraphe. Relis verbes/temps."}, {"matiere": "Français", "niveau": "3AS LG", "chapitre": "01. Le texte argumentatif (cœur du BAC)", "contenu_cours": "Thèse, arguments, exemples, connecteurs. Plans: pour/contre, concessif, analytique. Repérer thèse dès l'intro.", "explications_simplifiees": "Question BAC: 'Quelle est la thèse ?' = 1re phrase d'opinion. 3 arguments = 3 paragraphes."}, {"matiere": "Français", "niveau": "3AS LG", "chapitre": "02. Figures de style BAC", "contenu_cours": "Métaphore, comparaison, anaphore, hyperbole, antithèse, personnification. 1 définition + 1 exemple chacune.", "explications_simplifiees": "Comparaison = avec outil (comme), métaphore = sans outil."}, {"matiere": "Français", "niveau": "3AS LG", "chapitre": "03. Discours rapporté & voix", "contenu_cours": "Direct→indirect: temps reculés, pronoms changés. Active→passive: être + participe.", "explications_simplifiees": "Guillemets disparaissent à l'indirect. Accord du participe avec être."}, {"matiere": "Français", "niveau": "3AS LG", "chapitre": "04. Le compte-rendu objectif/subjectif", "contenu_cours": "Objectif: résumer sans avis (il, présent). Subjectif: + critique (je, adjectifs). Structure BAC langues.", "explications_simplifiees": "120 mots objectif. Ne donne jamais ton avis dans l'objectif."}, {"matiere": "Français", "niveau": "3AS LG", "chapitre": "05. Essai & synthèse BAC", "contenu_cours": "Problématique, 3 parties, exemples littéraires/actuels. Phrases de transition.", "explications_simplifiees": "Intro: amorce + problématique + plan. Conclusion: réponse + ouverture."}, {"matiere": "Français", "niveau": "3AS LG", "chapitre": "06. Histoire littéraire: siècles & mouvements", "contenu_cours": "Romantisme, Réalisme, Symbolisme, Existentialisme. Auteurs: Hugo, Baudelaire, Camus (Algérie).", "explications_simplifiees": "Camus = atout copie en Algérie. 1 citation par mouvement."}, {"matiere": "Français", "niveau": "3AS LG", "chapitre": "07. Grammaire BAC: subordonnées", "contenu_cours": "Relative, complétive, circonstancielle (cause, conséquence, but, concession). Connecteurs.", "explications_simplifiees": "Repère le mot subordonnant → nature → fonction."}, {"matiere": "Français", "niveau": "3AS LG", "chapitre": "08. Méthode épreuve BAC", "contenu_cours": "Compréhension (13pts): QCM, vrai/faux justifié, titre, résumé. Production (7pts): essai/compte-rendu.", "explications_simplifiees": "Gère 2h: 1h15 compréhension, 45 min production."}, {"matiere": "Arabe", "niveau": "3AS LG", "chapitre": "01. البناء الفكري - تحليل النص", "contenu_cours": "الفكرة العامة، الأفكار الأساسية، العاطفة، النمط (وصفي/حجاجي). أسئلة BAC أدبية ثابتة.", "explications_simplifiees": "احفظ منهجية الإجابة: الفكرة = جملة اسمية مختصرة."}, {"matiere": "Arabe", "niveau": "3AS LG", "chapitre": "02. البناء اللغوي - الإعراب", "contenu_cours": "النواسخ (كان/إن)، الممنوع من الصرف، البدل والعطف، إعراب الجمل. تدريب BAC لغات.", "explications_simplifiees": "ركز على إعراب المفردات + الجمل التي لها محل."}, {"matiere": "Arabe", "niveau": "3AS LG", "chapitre": "03. البلاغة: التشبيه والاستعارة", "contenu_cours": "التشبيه (مشبه/مشبه به/أداة)، الاستعارة (تصريحية/مكنية). أمثلة BAC.", "explications_simplifiees": "إذا ذُكر المشبه به → تصريحية، إذا حُذف → مكنية."}, {"matiere": "Arabe", "niveau": "3AS LG", "chapitre": "04. البلاغة: الكناية والمحسنات", "contenu_cours": "الكناية، الطباق، المقابلة، السجع، الجناس. أثرها البلاغي.", "explications_simplifiees": "احفظ الأثر: التوكيد، التجميل، الإيقاع."}, {"matiere": "Arabe", "niveau": "3AS LG", "chapitre": "05. العروض: البحور BAC", "contenu_cours": "الطويل، البسيط، الكامل، الوافر. الكتابة العروضية والرموز.", "explications_simplifiees": "تدرب على التقطيع: متحرك / ساكن."}, {"matiere": "Arabe", "niveau": "3AS LG", "chapitre": "06. الشعر: المهجر والالتزام", "contenu_cours": "شعراء المهجر (جبران)، الشعر الحر، القضية الفلسطينية والثورة الجزائرية.", "explications_simplifiees": "اربط الشاعر بالقضية: الالتزام = موقف."}, {"matiere": "Arabe", "niveau": "3AS LG", "chapitre": "07. النثر: المقال والمسرح", "contenu_cours": "المقال (مقدمة/عرض/خاتمة)، المسرحية، القصة. خصائص كل فن.", "explications_simplifiees": "المقال BAC: ذاتي/موضوعي، منهج الاستقراء."}, {"matiere": "Arabe", "niveau": "3AS LG", "chapitre": "08. منهجية BAC عربية", "contenu_cours": "البناء الفكري 10ن + اللغوي 06ن + التقويم النقدي 04ن. إدارة 2h30.", "explications_simplifiees": "التقويم النقدي = رأي + تعليل + شواهد."}, {"matiere": "Espagnol", "niveau": "3AS LG", "chapitre": "01. Presente & Pretéritos", "contenu_cours": "Presente: hablo, comes. Pretérito perfecto: he hablado. Indefinido: hablé. Imperfecto: hablaba.", "explications_simplifiees": "Indefinido = action finie datée, Imperfecto = habitude/description."}, {"matiere": "Espagnol", "niveau": "3AS LG", "chapitre": "02. Futuro & Condicional", "contenu_cours": "hablaré, hablaría. Ex: Me gustaría estudiar. Cortesía BAC.", "explications_simplifiees": "Condicional = souhait/politesse comme français."}, {"matiere": "Espagnol", "niveau": "3AS LG", "chapitre": "03. Subjuntivo presente", "contenu_cours": "hable, coma, viva. Après: quiero que, es necesario que, ojalá.", "explications_simplifiees": "Subjonctif après volonté/émotion/nécessité."}, {"matiere": "Espagnol", "niveau": "3AS LG", "chapitre": "04. Imperativo & Ser/Estar", "contenu_cours": "habla/hable. Ser = identité, Estar = état/lieu. Ex: Estoy cansado.", "explications_simplifiees": "Ser + adjectif permanent, Estar + temporaire."}, {"matiere": "Espagnol", "niveau": "3AS LG", "chapitre": "05. Opinión BAC", "contenu_cours": "Creo que, En mi opinión, Sin embargo, Por lo tanto. Redacción 120 palabras.", "explications_simplifiees": "3 párrafos + conectores = nota alta."}, {"matiere": "Espagnol", "niveau": "3AS LG", "chapitre": "06. Comprensión BAC", "contenu_cours": "Verdadero/Falso + justificación, título, léxico. Temas: juventud, medio ambiente.", "explications_simplifiees": "Justifica siempre con frase del texto."}, {"matiere": "Italien", "niveau": "3AS LG", "chapitre": "01. Base: presente & passato prossimo", "contenu_cours": "parlo, ho parlato, sono andato. Articoli: il/lo/la/i/gli/le.", "explications_simplifiees": "Essere pour mouvement, avere sinon."}, {"matiere": "Italien", "niveau": "3AS LG", "chapitre": "02. Futuro & condizionale", "contenu_cours": "parlerò, vorrei. Cortesia BAC.", "explications_simplifiees": "Vorrei = j'aimerais, clé de l'expression."}, {"matiere": "Italien", "niveau": "3AS LG", "chapitre": "03. Opinione BAC", "contenu_cours": "Penso che + congiuntivo, Secondo me. Temi: giovani, ambiente.", "explications_simplifiees": "Congiuntivo après penso che."}, {"matiere": "Histoire", "niveau": "3AS LG", "chapitre": "01. Le monde en 1945 & Guerre froide", "contenu_cours": "Yalta/Potsdam, bipolarisation USA/URSS, Truman/Jdanov, OTAN/Pacte Varsovie, crises: Corée, Cuba, Vietnam.", "explications_simplifiees": "Frise 1945-1991. 2 blocs + 2 doctrines = intro parfaite."}, {"matiere": "Histoire", "niveau": "3AS LG", "chapitre": "02. Coexistence pacifique & Détente", "contenu_cours": "Khrouchtchev, coexistence, SALT, Helsinki 1975. Puis 2e guerre froide (Afghanistan).", "explications_simplifiees": "Dates: 1953 mort Staline, 1962 Cuba, 1975 Helsinki."}, {"matiere": "Histoire", "niveau": "3AS LG", "chapitre": "03. Décolonisation & Tiers-monde", "contenu_cours": "Inde 1947, Algérie 1962, Non-alignés Bandung 1955. Causes/étapes.", "explications_simplifiees": "Bandung = naissance Tiers-monde. Citer 2 exemples."}, {"matiere": "Histoire", "niveau": "3AS LG", "chapitre": "04. L'Algérie 1945-1962", "contenu_cours": "Massacres 8 mai 1945, PPA/MTLD, 1er nov 1954, Congrès Soummam 1956, Évian 1962.", "explications_simplifiees": "5 dates = 5 paragraphes. Soummam = organisation."}, {"matiere": "Histoire", "niveau": "3AS LG", "chapitre": "05. L'Algérie depuis 1962 & monde actuel", "contenu_cours": "Indépendance, 1965, 1988, monde unipolaire, 11 sept 2001, mondialisation.", "explications_simplifiees": "Relie national/international dans la conclusion."}, {"matiere": "Géographie", "niveau": "3AS LG", "chapitre": "01. Mondialisation & échanges", "contenu_cours": "Flux, FTN, Nord/Sud, BRICS. Schémas BAC.", "explications_simplifiees": "Croquis: centres/périphéries."}, {"matiere": "Géographie", "niveau": "3AS LG", "chapitre": "02. Les USA, 1re puissance", "contenu_cours": "Atouts, rayonnement, limites. Étude de cas BAC.", "explications_simplifiees": "Plan: atouts/manifestations/limites."}, {"matiere": "Géographie", "niveau": "3AS LG", "chapitre": "03. L'UE & l'Asie", "contenu_cours": "UE intégration, Chine/Japon. Comparer.", "explications_simplifiees": "Cartes: mégalopoles, façades."}, {"matiere": "Géographie", "niveau": "3AS LG", "chapitre": "04. L'Algérie: territoire & économie", "contenu_cours": "Hydrocarbures, agriculture, aménagement, défis. Chiffres clés.", "explications_simplifiees": "Apprends 5 chiffres récents."}, {"matiere": "Philosophie", "niveau": "3AS LG", "chapitre": "01. Méthode dissertation & texte BAC", "contenu_cours": "Problématiser, plan dialectique (thèse/antithèse/synthèse), texte: dégager thèse + argument.", "explications_simplifiees": "Intro: amorce + problème + plan. 4h: 1h brouillon."}, {"matiere": "Philosophie", "niveau": "3AS LG", "chapitre": "02. Conscience & inconscient", "contenu_cours": "Descartes (cogito), Freud (ça/moi/surmoi), Sartre (mauvaise foi). Suis-je transparent à moi-même ?", "explications_simplifiees": "1 auteur par position + 1 exemple."}, {"matiere": "Philosophie", "niveau": "3AS LG", "chapitre": "03. Autrui, État & justice", "contenu_cours": "Sartre (enfer), Lévinas (visage), Hobbes/Rousseau (contrat), justice/égalité.", "explications_simplifiees": "Sujet BAC LG fréquent: autrui m'aliène-t-il ?"}, {"matiere": "Philosophie", "niveau": "3AS LG", "chapitre": "04. Travail, morale & bonheur", "contenu_cours": "Marx (aliénation), Kant (devoir), Épicure/Stoïciens (bonheur). Le travail libère-t-il ?", "explications_simplifiees": "Cite impératif catégorique Kant."}, {"matiere": "Philosophie", "niveau": "3AS LG", "chapitre": "05. Vérité & raison", "contenu_cours": "Doute cartésien, science/pop­per (réfutation), vérité/correspondance. Peut-on tout démontrer ?", "explications_simplifiees": "Distingue croire/savoir."}, {"matiere": "Sciences Islamiques", "niveau": "3AS LG", "chapitre": "01. العقيدة: الإيمان وأركانه", "contenu_cours": "أركان الإيمان الستة، التوحيد، الشرك. آيات وأحاديث.", "explications_simplifiees": "احفظ دليلاً نقلياً لكل ركن."}, {"matiere": "Sciences Islamiques", "niveau": "3AS LG", "chapitre": "02. العبادات: الصلاة والزكاة والصوم", "contenu_cours": "الأحكام، الشروط، المقاصد. BAC: الحكمة من التشريع.", "explications_simplifiees": "اربط الحكم بالمقصد (تزكية النفس)."}, {"matiere": "Sciences Islamiques", "niveau": "3AS LG", "chapitre": "03. المعاملات: البيع والربا", "contenu_cours": "أركان البيع، الربا أنواعه وحكمه. آيات البقرة.", "explications_simplifiees": "قاعدة: كل قرض جر نفعاً فهو ربا."}, {"matiere": "Sciences Islamiques", "niveau": "3AS LG", "chapitre": "04. الأسرة والميراث", "contenu_cours": "الزواج، الطلاق، الميراث وأنصبته. مسائل تطبيقية.", "explications_simplifiees": "تدرب على مسائل: 1/2، 1/4، 1/8، 2/3."}, {"matiere": "Sciences Islamiques", "niveau": "3AS LG", "chapitre": "05. مقاصد الشريعة", "contenu_cours": "الضروريات الخمس: الدين، النفس، العقل، النسل، المال. الترتيب.", "explications_simplifiees": "مثال لكل مقصد من الواقع."}, {"matiere": "Sciences Islamiques", "niveau": "3AS LG", "chapitre": "06. منهجية BAC", "contenu_cours": "حفظ الآيات (التوبة/البقرة المقررة)، شرح المفردات، الاستشهاد.", "explications_simplifiees": "اكتب الآية صحيحة + رقم السورة."}, {"matiere": "Maths", "niveau": "3AS LG", "chapitre": "01. Suites (niveau littéraire)", "contenu_cours": "arithmétique/géométrique, terme général, somme. Ex BAC simples.", "explications_simplifiees": "Formules: Un=U0+n·r, Un=U0·q^n."}, {"matiere": "Maths", "niveau": "3AS LG", "chapitre": "02. Fonctions & dérivation", "contenu_cours": "dérivée, tableau variations, limites simples. Courbes.", "explications_simplifiees": "f'=0 → extremum. Signe → sens."}, {"matiere": "Maths", "niveau": "3AS LG", "
